name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies (skip youtube-dl-exec's own binary download)
        run: npm ci
        env:
          YOUTUBE_DL_SKIP_DOWNLOAD: 'true'
      - name: Syntax check
        run: |
          for f in bin/download-me.js src/*.js; do node --check "$f"; done
      - name: Run tests
        run: npm test

  build-artifacts:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
        env:
          YOUTUBE_DL_SKIP_DOWNLOAD: 'true'
      - name: Build standalone Linux binary
        run: npm run build:binary
      - name: Build .deb package
        run: bash scripts/build-deb.sh
      - name: Upload artifacts to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/download-me-linux
            dist/*.deb
