name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '18'
      - name: Install dependencies
        run: npm ci
      - name: Syntax check
        if: runner.os == 'Linux'
        run: |
          for f in bin/save.js src/*.js; do node --check "$f"; done
      - name: Run tests
        run: npm test

  build-standalone:
    needs: test
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux-x64
          - os: windows-latest
            artifact: windows-x64
          - os: macos-15-intel
            artifact: macos-x64
          - os: macos-14
            artifact: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Build dependency-free archive
        run: npm run build:standalone
      - name: Build Debian package
        if: runner.os == 'Linux'
        run: bash scripts/build-deb.sh
      - name: Build macOS installer package
        if: runner.os == 'macOS'
        run: bash scripts/build-macos-pkg.sh
      - name: Upload standalone archive
        uses: actions/upload-artifact@v5
        with:
          name: save-${{ matrix.artifact }}
          path: |
            dist/*.zip
            dist/*.deb
            dist/*.pkg
          if-no-files-found: error

  release:
    needs: build-standalone
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Resolve release version
        id: release-version
        shell: bash
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "$TAG" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $TAG."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v5
        with:
          path: release-assets
          merge-multiple: true
      - name: Upload artifacts to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release-version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          overwrite_files: true
          fail_on_unmatched_files: true
          make_latest: true
          files: |
            release-assets/*.zip
            release-assets/*.deb
            release-assets/*.pkg
